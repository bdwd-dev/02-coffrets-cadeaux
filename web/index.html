<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffrets Cadeaux BZ</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121212; color: #fff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #333; }
    .logo { font-size: 24px; font-weight: bold; color: #FF6B35; }
    .nav { display: flex; gap: 20px; }
    .nav a { color: #aaa; text-decoration: none; font-size: 14px; }
    .nav a:hover { color: #FF6B35; }
    .hero { text-align: center; padding: 60px 20px; }
    .hero h1 { font-size: 36px; margin-bottom: 16px; color: #FF6B35; }
    .hero p { color: #888; font-size: 18px; max-width: 600px; margin: 0 auto 30px; }
    .btn { background: #FF6B35; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px 0; }
    .product-card { background: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #2a2a2a; }
    .product-card:hover { border-color: #FF6B35; }
    .product-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .product-desc { color: #888; font-size: 14px; margin-bottom: 12px; }
    .product-price { font-size: 20px; font-weight: bold; color: #FF6B35; }
    .product-occasion { display: inline-block; background: #333; padding: 4px 10px; border-radius: 20px; font-size: 11px; color: #aaa; margin-bottom: 10px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 30px 0; }
    .stat-card { background: #1a1a1a; border-radius: 12px; padding: 20px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: bold; color: #FF6B35; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .footer { text-align: center; padding: 40px 0; color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = 'https://zero2-coffrets-cadeaux-backend.onrender.com/api';

    function App() {
      const [products, setProducts] = useState([]);
      const [stats, setStats] = useState({});
      const [cart, setCart] = useState([]);

      useEffect(() => {
        fetch(`${API}/products`).then(r => r.json()).then(setProducts);
        fetch(`${API}/stats`).then(r => r.json()).then(setStats);
      }, []);

      const addToCart = (p) => {
        setCart([...cart, p]);
        alert(`${p.name} ajouté au panier`);
      };

      return (
        <div>
          <header className="header">
            <div className="logo">🎁 Coffrets Cadeaux BZ</div>
            <nav className="nav">
              <a href="#">Catalogue</a>
              <a href="#">Occasions</a>
              <a href="#">Livraison</a>
              <a href="#">🛒 ({cart.length})</a>
            </nav>
          </header>

          <section className="hero">
            <h1>Offrez l'exception</h1>
            <p>Coffrets cadeaux premium avec livraison gratuite partout à Brazzaville</p>
            <button className="btn">Voir le catalogue</button>
          </section>

          <div className="container">
            <div className="stats">
              <div className="stat-card">
                <div className="stat-value">{stats.products}</div>
                <div className="stat-label">Coffrets</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.orders}</div>
                <div className="stat-label">Commandes</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.revenue?.toLocaleString()} F</div>
                <div className="stat-label">CA</div>
              </div>
            </div>

            <div className="products">
              {products.map(p => (
                <div key={p.id} className="product-card">
                  <span className="product-occasion">{p.occasion}</span>
                  <div className="product-name">{p.name}</div>
                  <div className="product-desc">{p.description}</div>
                  <div className="product-price">{p.price?.toLocaleString()} XAF</div>
                  <button className="btn" style={{ width: '100%', marginTop: '12px' }} onClick={() => addToCart(p)}>
                    Ajouter au panier
                  </button>
                </div>
              ))}
            </div>
          </div>

          <footer className="footer">
            <p>© 2026 Coffrets Cadeaux BZ — Brazzaville</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
